<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GeoCheck: Географический тренажер</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  /* Общие стили */
  body {
    margin: 0;
    background: #20262e;
    color: #eef1f4;
    font-family: Arial, sans-serif;
  }

  /* Шапка */
  header {
    background: #161b21;
    padding: 15px 30px;
    border-bottom: 1px solid #44505c;
  }
  .logo { font-size: 24px; font-weight: bold; }
  .subtitle { color: #9aa5b1; margin-top: 5px; }

  /* Основной блок */
  .main { display: flex; gap: 20px; padding: 20px; }
  .panel { width: 360px; background: #2d3640; border: 1px solid #44505c; border-radius: 8px; padding: 20px; }
  .map-box { flex: 1; background: #2d3640; border: 1px solid #44505c; border-radius: 8px; padding: 20px; }

  /* Панель теста */
  .choose { color: #9aa5b1; margin-bottom: 8px; }
  select { width: 100%; background: #20262e; color: #eef1f4; border: 1px solid #44505c; padding: 10px; border-radius: 5px; font-size: 15px; margin-bottom: 20px; }
  .top-row { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .badge { background: #3b4856; padding: 4px 10px; border-radius: 5px; }
  .target { background: #3b4856; border-radius: 8px; padding: 20px; text-align: center; margin: 15px 0; }
  .target-label { color: #f2c14e; margin-bottom: 5px; }
  .target-name { font-size: 26px; font-weight: bold; }

  /* Ответ */
  #feedback { display: none; padding: 12px; border-radius: 5px; margin-bottom: 15px; }
  #feedback.correct { display: block; background: #2e5a3a; }
  #feedback.wrong { display: block; background: #6b2c36; }

  /* Кнопки */
  button { width: 100%; background: #e07a3f; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; cursor: pointer; }
  button:hover { background: #c4652d; }

  /* Результаты */
  #results { display: none; text-align: center; background: #20262e; border: 1px solid #e07a3f; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
  #grade { font-size: 40px; font-weight: bold; color: #5aa469; margin: 10px 0; }
  #grade.bad { color: #d1495b; }

  /* Карта */
  .map-top { display: flex; justify-content: space-between; margin-bottom: 15px; }
  .hint { color: #f2c14e; }
  #map { height: 620px; background: white; border-radius: 5px; }

  /* Адаптация для телефонов и планшетов */
  @media (max-width: 800px) {
    header { padding: 12px 16px; }
    .logo { font-size: 20px; }
    .subtitle { font-size: 13px; }
    .main { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
    .panel, .map-box { width: auto; box-sizing: border-box; }
    .panel { padding: 14px; }
    .map-box { padding: 12px; }
    #map { height: 65vh; min-height: 380px; max-height: 600px; }
    .target-name { font-size: 22px; }
    .top-row { font-size: 14px; }
    button, select { font-size: 16px; min-height: 44px; }
    footer { padding: 14px; font-size: 12px; }
  }

  @media (max-width: 420px) {
    .main { padding: 8px; }
    .panel, .map-box { padding: 10px; }
    #map { height: 62vh; min-height: 340px; }
    .target { padding: 14px; }
    .target-name { font-size: 20px; }
  }


  footer { text-align: center; padding: 20px; color: #9aa5b1; }
</style>
</head>
<body>

<header>

    <div class="top-row">
      <span class="badge" id="badge">Категория</span>
      <span>Прогресс: <span id="step">0</span> / <span id="total">0</span></span>
    </div>

    <div id="task">Найдите и нажмите маркер на карте:</div>
    <div class="target" id="target">
      <div class="target-label" id="target-label">Категория</div>
      <div class="target-name" id="target-name">...</div>
    </div>

    <div id="feedback"></div>

    <div id="results">
      <h3>Тест завершен! 🎓</h3>
      <div id="score"></div>
      <div id="grade"></div>
      <div id="results-desc"></div>
      <br>
      <button onclick="start()">Пройти заново 🔄</button>
    </div>

    <button id="next-btn" onclick="next()" style="display:none;">Следующий объект →</button>
  </div>

  <div class="map-box">
    <div class="map-top">
      <b>Белая контурная карта (без подписей)</b>
      <span class="hint" id="hint"></span>
    </div>
    <div id="map"></div>
  </div>
</div>

<footer>© 2026 Контурный тренажер. Оценка от 1 до 5.</footer>

// ====== ПЕРЕМЕННЫЕ ======
var map, pts = [], list, q, i, ok, t;
var orange = '#e07a3f';
var green = '#5aa469';
var red = '#d1495b';

function $(id) {
  return document.getElementById(id);
}

// ====== КАРТА ======
function initMap() {
  map = L.map('map').setView([20, 0], 2);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    attribution: 'Tiles &copy; Esri'
  }).addTo(map);
}

// ====== ТЕСТ ======
function start() {
  var s = $('category');
  list = d[s.value];
  ok = 0;
  i = 0;
  $('results').style.display = 'none';
  $('target').style.display = 'block';
  $('task').style.display = 'block';
  $('badge').innerText = s.options[s.selectedIndex].text + ' (' + list.length + ')';
  $('total').innerText = list.length;

  for (var n = 0; n < pts.length; n++) {
    map.removeLayer(pts[n].m);
  }
  pts = [];

  q = list.slice();
  q.sort(function () { return Math.random() - 0.5; });

  map.setView([20, 0], 2);
  list.forEach(function (o) {
    var m = L.circleMarker(o.coords, { radius: 6, color: 'white', weight: 2, fillColor: orange, fillOpacity: 1 }).addTo(map);
    m.on('click', function () { guess(o, m); });
    pts.push({ o: o, m: m });
  });
  $('hint').innerText = '💡 Маркеров: ' + list.length + '. Колесо мыши — приблизить карту';
  show();
}

function show() {
  $('feedback').className = '';
  $('next-btn').style.display = 'none';
  if (i >= q.length) {
    end();
    return;
  }
  t = q[i];
  $('step').innerText = i + 1;
  $('target-label').innerText = t.catName;
  $('target-name').innerText = t.name;
  pts.forEach(function (p) { p.m.setStyle({ fillColor: orange }); });
}

function guess(o, m) {
  if ($('next-btn').style.display == 'block') return;
  var b = $('feedback');
  if (o == t) {
    ok++;
    b.className = 'correct';
    b.innerHTML = '<b>Верно! 🎉</b> Это <b>' + t.name + '</b>.';
    m.setStyle({ fillColor: green });
  } else {
    b.className = 'wrong';
    b.innerHTML = '<b>Неверно.</b> Вы нажали на «' + o.name + '».<br>Нужно было найти: <b>' + t.name + '</b>.';
    m.setStyle({ fillColor: red });
    pts.forEach(function (p) {
      if (p.o == t) p.m.setStyle({ fillColor: green });
    });
  }
  $('next-btn').style.display = 'block';
}

function next() {
  i++;
  show();
}

function end() {
  $('target').style.display = 'none';
  $('task').style.display = 'none';
  var n = q.length;
  var p = Math.round(ok / n * 100);
  var g, text;
  if (p >= 90) {
    g = 5;
    text = 'Превосходно! Почти всё указано верно.';
  } else if (p >= 75) {
    g = 4;
    text = 'Хороший результат!';
  } else if (p >= 60) {
    g = 3;
    text = 'Удовлетворительно. Стоит повторить.';
  } else {
    g = 2;
    text = 'Тест не сдан. Повторите объекты этой категории.';
  }
  $('score').innerText = 'Правильных ответов: ' + ok + ' из ' + n + ' (' + p + '%)';
  $('grade').innerText = 'Оценка: ' + g;
  if (g == 2) {
    $('grade').className = 'bad';
  } else {
    $('grade').className = '';
  }
  $('results-desc').innerText = text;
  $('results').style.display = 'block';
}

// ====== ЗАПУСК ======
window.onload = function () {
  initMap();
  start();
};
